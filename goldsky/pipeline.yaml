name: stripe-onchain
resource_size: s
use_dedicated_ip: false
job: false
sources:
  source_1:
    dataset_name: base_sepolia.raw_logs
    filter: address = '0xc91a4d1b95ea603f01125b9590baf130613a3665'
    start_at: earliest
    type: dataset
    version: 1.0.0
transforms:
  decode:
    primary_key: id
    sql: |-
      SELECT id, block_number, block_timestamp, transaction_hash, log_index,
          _gs_log_decode(
            _gs_fetch_abi('https://gist.githubusercontent.com/tymna/80c0254634d72aaa6a165d255a5c6d0e/raw/SubscriptionManager.json','raw'),
            topics, data
          ) AS decoded
        FROM source_1
    type: sql
  events:
    primary_key: id
    sql: |-
      -- Subscribed / Renewed
        SELECT
            concat(transaction_hash,'-',log_index)   AS id,
            decoded.event_signature                  AS event_type,
            block_number                             AS block_number,
            to_timestamp(block_timestamp)            AS block_timestamp,
            transaction_hash                         AS tx_hash,
            log_index                                AS log_index,
            CAST(NULL AS STRING)                      AS merchant,
            decoded.event_params[1]                   AS subscriber,
            decoded.event_params[2]                   AS sub_id,
            CAST(decoded.event_params[3] AS bigint)   AS plan_id,
            CAST(NULL AS bigint)                      AS price,
            CAST(decoded.event_params[4] AS bigint)   AS amount,
            CAST(NULL AS bigint)                      AS "interval",
            to_timestamp(CAST(decoded.event_params[5] AS bigint)) AS expires_at,
            CAST(NULL AS BOOLEAN)                     AS active,
            CAST(NULL AS STRING)                      AS name
          FROM decode WHERE decoded.event_signature IN ('Subscribed','Renewed')

        UNION ALL   -- Cancelled
        SELECT
            concat(transaction_hash,'-',log_index)   AS id,
            decoded.event_signature                  AS event_type,
            block_number                             AS block_number,
            to_timestamp(block_timestamp)            AS block_timestamp,
            transaction_hash                         AS tx_hash,
            log_index                                AS log_index,
            CAST(NULL AS STRING)                      AS merchant,
            decoded.event_params[1]                   AS subscriber,
            decoded.event_params[2]                   AS sub_id,
            CAST(decoded.event_params[3] AS bigint)   AS plan_id,
            CAST(NULL AS bigint)                      AS price,
            CAST(NULL AS bigint)                      AS amount,
            CAST(NULL AS bigint)                      AS "interval",
            CAST(NULL AS TIMESTAMP)                    AS expires_at,
            CAST(NULL AS BOOLEAN)                     AS active,
            CAST(NULL AS STRING)                      AS name
          FROM decode WHERE decoded.event_signature = 'Cancelled'

        UNION ALL   -- PlanCreated
        SELECT
            concat(transaction_hash,'-',log_index)   AS id,
            decoded.event_signature                  AS event_type,
            block_number                             AS block_number,
            to_timestamp(block_timestamp)            AS block_timestamp,
            transaction_hash                         AS tx_hash,
            log_index                                AS log_index,
            decoded.event_params[1]                   AS merchant,
            CAST(NULL AS STRING)                      AS subscriber,
            CAST(NULL AS STRING)                      AS sub_id,
            CAST(decoded.event_params[2] AS bigint)   AS plan_id,
            CAST(decoded.event_params[4] AS bigint)   AS price,
            CAST(NULL AS bigint)                      AS amount,
            CAST(decoded.event_params[5] AS bigint)   AS "interval",
            CAST(NULL AS TIMESTAMP)                    AS expires_at,
            CAST(NULL AS BOOLEAN)                     AS active,
            decoded.event_params[3]                   AS name
          FROM decode WHERE decoded.event_signature = 'PlanCreated'

        UNION ALL   -- PlanUpdated
        SELECT
            concat(transaction_hash,'-',log_index)   AS id,
            decoded.event_signature                  AS event_type,
            block_number                             AS block_number,
            to_timestamp(block_timestamp)            AS block_timestamp,
            transaction_hash                         AS tx_hash,
            log_index                                AS log_index,
            decoded.event_params[1]                   AS merchant,
            CAST(NULL AS STRING)                      AS subscriber,
            CAST(NULL AS STRING)                      AS sub_id,
            CAST(decoded.event_params[2] AS bigint)   AS plan_id,
            CAST(decoded.event_params[3] AS bigint)   AS price,
            CAST(NULL AS bigint)                      AS amount,
            CAST(decoded.event_params[4] AS bigint)   AS "interval",
            CAST(NULL AS TIMESTAMP)                    AS expires_at,
            CAST(NULL AS BOOLEAN)                     AS active,
            CAST(NULL AS STRING)                      AS name
          FROM decode WHERE decoded.event_signature = 'PlanUpdated'

        UNION ALL   -- PlanStatusChanged
        SELECT
          concat(transaction_hash,'-',log_index)   AS id,
          decoded.event_signature                  AS event_type,
          block_number                             AS block_number,
          to_timestamp(block_timestamp)            AS block_timestamp,
          transaction_hash                         AS tx_hash,
          log_index                                AS log_index,
          decoded.event_params[1]                   AS merchant,
          CAST(NULL AS STRING)                      AS subscriber,
          CAST(NULL AS STRING)                      AS sub_id,
          CAST(decoded.event_params[2] AS bigint)   AS plan_id,
          CAST(NULL AS bigint)                      AS price,
          CAST(NULL AS bigint)                      AS amount,
          CAST(NULL AS bigint)                      AS "interval",
          CAST(NULL AS TIMESTAMP)                    AS expires_at,
          CAST(decoded.event_params[3] AS BOOLEAN)  AS active,
          CAST(NULL AS STRING)                      AS name
        FROM decode WHERE decoded.event_signature = 'PlanStatusChanged'

      UNION ALL   -- MerchantAdded
      SELECT
          concat(transaction_hash,'-',log_index)   AS id,
          decoded.event_signature                  AS event_type,
          block_number                             AS block_number,
          to_timestamp(block_timestamp)            AS block_timestamp,
          transaction_hash                         AS tx_hash,
          log_index                                AS log_index,
          decoded.event_params[1]                   AS merchant,
          CAST(NULL AS STRING)                      AS subscriber,
          CAST(NULL AS STRING)                      AS sub_id,
          CAST(NULL AS bigint)                      AS plan_id,
          CAST(NULL AS bigint)                      AS price,
          CAST(NULL AS bigint)                      AS amount,
          CAST(NULL AS bigint)                      AS "interval",
          CAST(NULL AS TIMESTAMP)                    AS expires_at,
          CAST(NULL AS BOOLEAN)                     AS active,
          CAST(NULL AS STRING)                      AS name
        FROM decode WHERE decoded.event_signature = 'MerchantAdded'
    type: sql
  sql_payments:
    primary_key: id
    sql: |-
      SELECT
          concat(transaction_hash, '-', log_index) AS id,
          decoded.event_signature                  AS event_type,
          decoded.event_params[1]                  AS subscriber,
          decoded.event_params[2]                  AS sub_id,
          CAST(decoded.event_params[3] AS bigint)  AS plan_id,
          CAST(decoded.event_params[4] AS bigint) AS amount,
          to_timestamp(CAST(decoded.event_params[5] AS bigint)) AS expires_at,
          block_number,
          to_timestamp(block_timestamp)            AS block_timestamp,
          transaction_hash                         AS tx_hash,
          log_index
        FROM decode
        WHERE decoded.event_signature IN ('Subscribed','Renewed')
    type: sql
sinks:
  payments:
    batch_flush_interval: null
    batch_size: null
    from: sql_payments
    schema: public
    secret_name: POSTGRES_SECRET_CMQT6RD1Y0
    table: payments
    type: postgres
  sink_3:
    batch_flush_interval: null
    batch_size: null
    from: events
    schema: public
    secret_name: POSTGRES_SECRET_CMQT6RD1Y0
    table: events
    type: postgres
config_overrides:
  image_tag: main-a1427d106f837557fabf219a11dc09d5dd669578
