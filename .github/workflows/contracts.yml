name: contracts

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

# GitHub only reads workflows from the repository root, so this lives here while
# the Foundry project it drives lives in contracts/ — hence working-directory.
defaults:
  run:
    working-directory: contracts

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive # forge-std + solady live in contracts/lib

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
