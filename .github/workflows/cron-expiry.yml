name: cron-expiry

permissions: {}

# Daily expiry sweep: pokes the API's cron endpoint, which sends reminder emails.
# Render's free tier sleeps when idle, so the retries + long timeout cover a cold start.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  expiry:
    name: Expiry sweep
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/v1/cron/expiry
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 90 \
            -X POST "$API_URL/api/v1/cron/expiry" \
            -H "x-cron-secret: $CRON_SECRET"
